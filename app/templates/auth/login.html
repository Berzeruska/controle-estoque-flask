{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block titulo %}Entrar{% endblock %}
{% block classe_main %}tela-acesso{% endblock %}
{% block conteudo %}
<section class="cartao-acesso">
  <div class="marca grande">
    <img src="{{ url_for('static', filename='icone.svg') }}" alt="" width="36" height="36">
    Almoxarifado
  </div>
  <p class="sub">Controle de entrada e saída de produtos</p>
  <form method="post">
    {{ csrf() }}
    <label>E-mail
      <input type="email" name="email" value="{{ email }}" autocomplete="username" required autofocus>
    </label>
    <label>Senha
      <input type="password" name="senha" autocomplete="current-password" required>
    </label>
    <button class="botao primario largo">Entrar</button>
  </form>
  <p class="dica">Demonstração: <code>admin@demo.com</code> / <code>Admin123</code></p>
</section>
{% endblock %}
