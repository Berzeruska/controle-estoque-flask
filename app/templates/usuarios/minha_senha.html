{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block titulo %}Trocar senha{% endblock %}
{% block conteudo %}
<div class="cabecalho"><h1>Trocar senha</h1></div>
<form method="post" class="formulario estreito">
  {{ csrf() }}
  <label>Senha atual <input type="password" name="atual" autocomplete="current-password" required></label>
  <label>Nova senha <input type="password" name="nova" minlength="8" autocomplete="new-password" required></label>
  <label>Confirme a nova senha <input type="password" name="confirmacao" minlength="8" autocomplete="new-password" required></label>
  <div class="acoes"><button class="botao primario">Alterar</button></div>
</form>
{% endblock %}
